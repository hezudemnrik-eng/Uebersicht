<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a1a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="App-Hub">
<title>App-Hub</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="apple-touch-icon" id="touchicon" href="data:,">
<style>
/* ===== Design-Tokens ===== */
:root {
  color-scheme: dark;
  --bg: #0a1a2f;
  --surface: #11243c;
  --surface-2: #172f4d;
  --surface-3: #1f3b5e;
  --border: #24426a;
  --border-2: #31557f;
  --well: #0b1c31;
  --well-2: #08162a;
  --text: #f6eedb;
  --text-2: #c6cfdd;
  --text-3: #8b9ab2;
  --accent: #e33b3f;
  --accent-strong: #ff5d60;
  --accent-ink: #ffffff;
  --accent-soft: rgba(227, 59, 63, .16);
  --danger: #ef5350;
  --danger-soft: rgba(239, 83, 80, .14);
  --ok: #4fc46a;
  --bad: #ef5350;
  --gold: #ffd23f;
  --ink: #2a170b;
  --paper: #f4e6c4;
  --paper-2: #e9d5a6;
  --radius: 12px;
  --radius-sm: 7px;
  --shadow: 0 12px 34px rgba(0, 0, 0, .5);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: "Bangers", "Impact", "Arial Black", system-ui, sans-serif;
}
:root[data-accent="sun"] { --accent: #f5b82e; --accent-strong: #ffcd57; --accent-ink: #2b1a00; --accent-soft: rgba(245, 184, 46, .15); }
:root[data-accent="sea"] { --accent: #2fa8e0; --accent-strong: #5cc1f0; --accent-ink: #03202e; --accent-soft: rgba(47, 168, 224, .16); }
:root[data-accent="zoro"] { --accent: #3fb56b; --accent-strong: #62cd89; --accent-ink: #04210f; --accent-soft: rgba(63, 181, 107, .16); }

/* ===== Grundlagen ===== */
* { box-sizing: border-box; }
html { background: var(--bg); }
/* Hintergrundbild fest hinter der Seite (auch am iPhone, dort klappt background-attachment: fixed nicht) */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--bg);
  background-image: linear-gradient(180deg, rgba(10, 26, 47, .2) 0%, rgba(10, 26, 47, .45) 40%, rgba(7, 19, 36, .7) 100%), var(--bg-wide);
  background-size: cover; background-position: center top; }
@media (max-aspect-ratio: 1/1) { body::before { background-image: linear-gradient(180deg, rgba(10, 26, 47, .2) 0%, rgba(10, 26, 47, .45) 40%, rgba(7, 19, 36, .7) 100%), var(--bg-tall); } }
body { margin: 0; min-height: 100vh; background: transparent; position: relative; z-index: 0; color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-strong); }
[hidden] { display: none !important; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.px-icon { display: inline-flex; flex: none; }
.px-icon svg { display: block; overflow: visible; }
.ui-icon { display: inline-flex; flex: none; }
.ui-icon svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== Buttons & Eingaben ===== */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); cursor: pointer; white-space: nowrap; line-height: 1.2; text-decoration: none; }
.btn:hover { background: var(--surface-3); }
.btn:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .cat-toggle:focus-visible, .icon-opt:focus-visible, .swatch:focus-visible, .accent-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: rgba(0, 0, 0, .35); color: var(--accent-ink); font-weight: 700; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .25), 0 2px 0 rgba(0, 0, 0, .35); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
.btn.small { padding: 5px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-sm); border: 0; background: transparent; color: var(--text-3); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; color: var(--text-3); }
.icon-btn.danger-hover:hover { color: var(--danger); background: var(--danger-soft); }
.input, select.input, textarea.input { width: 100%; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--well); color: var(--text); outline: none; min-width: 0; }
.input:focus, textarea.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.5; }
.input::placeholder, textarea::placeholder { color: var(--text-3); }
select.input { padding-right: 28px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.field-hint { font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
.field-hint.bad { color: #ff7b78; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--well); border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 2px; gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }

/* ===== Kopfbereich ===== */
.wrap { max-width: 1480px; margin: 0 auto; padding: 24px 28px 40px; }
.top { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand-name { font-family: var(--font-head); font-size: 29px; line-height: .95; letter-spacing: .05em; color: var(--gold); text-shadow: 2px 0 0 #7a1c12, -2px 0 0 #7a1c12, 0 2px 0 #7a1c12, 0 -2px 0 #7a1c12, 1.5px 1.5px 0 #7a1c12, -1.5px -1.5px 0 #7a1c12, 1.5px -1.5px 0 #7a1c12, -1.5px 1.5px 0 #7a1c12, 3px 4px 0 rgba(0, 0, 0, .45); }
.brand .px-icon { filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .35)); transform: rotate(-8deg); }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.summary .sum { display: inline-flex; align-items: center; gap: 5px; }
.summary .dot { width: 7px; height: 7px; border-radius: 2px; }
.summary .on .dot { background: var(--ok); }
.summary .off { color: #ff8a87; }
.summary .sum:first-child { color: var(--text-2); }
.summary .off .dot { background: var(--bad); }
.search { position: relative; flex: 0 1 380px; min-width: 220px; }
.search .ui-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .input { padding-left: 34px; height: 36px; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.top-actions .btn { height: 36px; }
.view-head { display: flex; align-items: center; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.view-head h1 { font-family: var(--font-head); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; letter-spacing: .05em; color: var(--gold); text-shadow: 2px 2px 0 #7a1c12; }
.head-text { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
h2.section { font-family: var(--font-head); font-weight: 400; font-size: 21px; margin: 0 0 12px; letter-spacing: .05em; display: flex; align-items: center; gap: 8px; }

/* ===== Hinweise & Toasts ===== */
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); flex-wrap: wrap; margin-bottom: 18px; }
.banner .text { flex: 1; min-width: 200px; }
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: min(420px, calc(100vw - 36px)); }
.toast { display: flex; align-items: center; gap: 12px; background: var(--surface-3); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 10px 12px 10px 14px; box-shadow: var(--shadow); animation: toast-in .18s ease-out; }
.toast.error { border-color: var(--danger); }
.toast .text { flex: 1; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ===== Kategorien-Leiste ===== */
.cat-nav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px; margin: 0 -28px 18px; padding: 10px 28px; overflow-x: auto; scrollbar-width: none;
  background: linear-gradient(180deg, rgba(10, 26, 47, .96), rgba(10, 26, 47, .88)); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
.cat-nav::-webkit-scrollbar { display: none; }
.cat-chip { --cc: var(--accent); display: inline-flex; align-items: center; gap: 7px; flex: none; padding: 5px 11px 5px 9px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; white-space: nowrap; }
.cat-chip:hover { border-color: var(--cc); background: color-mix(in srgb, var(--cc) 16%, var(--surface)); }
.cat-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cat-chip .flag { width: 12px; height: 10px; background: var(--cc); clip-path: polygon(0 0, 100% 0, 72% 50%, 100% 100%, 0 100%); flex: none; }
.cat-chip .n { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; }
.cat-chip.is-collapsed { opacity: .65; }
.cat-nav .btn { flex: none; margin-left: auto; }

/* ===== Kategorien ===== */
.cats { display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch; }
.cat { --cc: var(--accent); --span: 1; position: relative; flex: var(--span) 1 calc(var(--span) * 222px + 30px); min-width: min(100%, 250px); max-width: 100%; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .015)); border: 1px solid var(--border); border-radius: 16px; padding: 0 14px 14px; scroll-margin-top: 70px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .22); }
.cat.collapsed { align-self: flex-start; padding-bottom: 0; }
.cat.flash { animation: cat-flash 1s ease-out; }
@keyframes cat-flash { from { box-shadow: 0 0 0 3px var(--cc), 0 6px 20px rgba(0, 0, 0, .22); } }
.cat-head { display: flex; align-items: center; gap: 10px; margin: 0 -14px 12px; padding: 6px 10px 6px 12px; min-height: 44px; border-radius: 15px 15px 0 0; border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, color-mix(in srgb, var(--cc) 30%, transparent), color-mix(in srgb, var(--cc) 6%, transparent) 65%, transparent); }
.cat.collapsed .cat-head { margin-bottom: 0; border-bottom: 0; border-radius: 15px; }
.cat-head.drag-over { background: var(--accent-soft); }
.cat-flag { width: 20px; height: 22px; flex: none; position: relative; }
.cat-flag::before { content: ""; position: absolute; left: 1px; top: 0; bottom: 0; width: 2px; border-radius: 1px; background: #c9a57e; }
.cat-flag::after { content: ""; position: absolute; left: 3px; top: 1px; width: 17px; height: 13px; background: var(--cc); clip-path: polygon(0 0, 100% 0, 74% 50%, 100% 100%, 0 100%); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .2); }
.cat-toggle { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--text); cursor: pointer; padding: 2px 4px 0 0; font-family: var(--font-head); font-size: 20px; line-height: 1.1; letter-spacing: .05em; text-align: left; min-width: 0; border-radius: 4px; text-shadow: 1px 2px 0 rgba(0, 0, 0, .45); }
.cat-toggle:disabled { cursor: default; color: var(--text); }
.cat-toggle .ui-icon { color: var(--text-3); transition: transform .15s; transform: rotate(90deg); }
.cat.collapsed .cat-toggle .ui-icon { transform: none; }
.cat-name { overflow-wrap: anywhere; }
.cat.none .cat-name { color: var(--text-2); }
.cat-count { font-size: 12px; font-weight: 700; color: var(--ink); background: color-mix(in srgb, var(--cc) 55%, var(--paper)); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; flex: none; }
.cat-peek { display: flex; gap: 4px; min-width: 0; overflow: hidden; flex: 1; justify-content: flex-end; }
.cat-peek .app-badge { width: 26px; height: 26px; border-radius: 7px; }
.cat-peek .app-badge img, .cat-peek .app-badge .px-icon svg { width: 17px; height: 17px; }
.cat-peek .app-badge .letter { font-size: 14px; }
.cat-line { flex: 1; min-width: 4px; }
.cat-tools { display: none; gap: 2px; }
.cat-head:hover .cat-tools, .cat-head:focus-within .cat-tools, .arranging .cat-tools { display: flex; }

/* ===== Kacheln (Steckbriefe) ===== */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; border-radius: var(--radius); transition: background .15s; flex: 1; align-content: start; }
.tiles.drag-over { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); }
.tiles-empty { grid-column: 1 / -1; color: var(--text-3); font-size: 13px; padding: 16px; border: 1px dashed var(--border-2); border-radius: var(--radius-sm); text-align: center; }
.tile { --text: var(--ink); --text-2: #5b3e24; --text-3: #8a6a48; --surface-3: rgba(90, 55, 20, .14); --accent-soft: rgba(227, 59, 63, .2);
  position: relative; display: flex; flex-direction: column; min-width: 0; color: var(--text); border: 2px solid #3a2312; border-radius: 8px;
  background: radial-gradient(120% 90% at 50% 40%, var(--paper) 55%, var(--paper-2) 100%);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .35), 0 8px 18px rgba(0, 0, 0, .25), inset 0 0 0 3px rgba(255, 248, 225, .45);
  transition: transform .14s ease, box-shadow .14s ease; }
.tile::before { content: ""; position: absolute; left: -2px; right: -2px; top: -2px; height: 7px; border-radius: 7px 7px 0 0; background: var(--pc); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .22); }
.tile:hover { transform: translateY(-3px) rotate(-.4deg); box-shadow: 0 6px 0 rgba(0, 0, 0, .3), 0 14px 24px rgba(0, 0, 0, .3), inset 0 0 0 3px rgba(255, 248, 225, .45); }
.tile:nth-child(even):hover { transform: translateY(-3px) rotate(.4deg); }
.tile.dragging { opacity: .4; }
.tile.drop-before::after, .tile.drop-after::after { content: ""; position: absolute; top: 6px; bottom: 6px; width: 4px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tile.drop-before::after { left: -10px; }
.tile.drop-after::after { right: -10px; }
.tile-main { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; align-content: start; gap: 0 10px; padding: 13px 12px 4px; color: var(--text); text-decoration: none; flex: 1; border-radius: 8px 8px 0 0; }
.tile-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tile-main.disabled { cursor: default; }
.tile-text { min-width: 0; }
.tile-name { display: flex; align-items: center; gap: 6px; font-family: var(--font-head); font-weight: 400; font-size: 18px; letter-spacing: .04em; line-height: 1.1; }
.tile-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-name .ui-icon { color: var(--text-3); }
.tile-host { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
.tile-main.disabled .tile-host { color: #b3261e; }
.tile-desc { grid-column: 1 / -1; color: var(--text-2); font-size: 12.5px; line-height: 1.35; margin-top: 7px; padding-top: 6px; border-top: 1px dashed rgba(90, 55, 20, .3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tile-foot { display: flex; align-items: center; gap: 2px; padding: 0 6px 5px 12px; min-height: 32px; }
.tile-foot .icon-btn { width: 28px; height: 28px; }
.tile-foot .icon-btn.has-notes { color: #c0262b; }
.tile .status.online { color: #2f6b2c; }
.tile .status.offline { color: #b3261e; }
.app-badge { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; flex: none; overflow: hidden; background: color-mix(in srgb, var(--pc) 24%, #fff8e6); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pc) 70%, #2a170b), 0 2px 0 rgba(0, 0, 0, .25); }
.app-badge img, .app-badge .px-icon svg { width: 24px; height: 24px; object-fit: contain; }
.app-badge .letter { font-family: var(--font-head); font-size: 20px; line-height: 1; color: color-mix(in srgb, var(--pc) 70%, #1a0d04); white-space: nowrap; }
.app-badge.big { width: 66px; height: 66px; }
.app-badge.big img, .app-badge.big .px-icon svg { width: 40px; height: 40px; }
.app-badge.big .letter { font-size: 34px; }

/* ===== Online-Status ===== */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--text-3); flex: none; }
.status.online { color: var(--text-2); }
.status.online .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(92, 200, 92, .16); }
.status.offline { color: #ff8a87; }
.status.offline .dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(239, 83, 80, .16); }
.status.checking .dot { animation: pulse .9s ease-in-out infinite alternate; }
.status.unknown .dot, .status.none .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }

/* ===== Leerer Zustand, Fuß ===== */
.welcome { max-width: 620px; margin: 30px auto; text-align: center; padding: 30px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.welcome h2 { font-family: var(--font-head); font-weight: 400; font-size: 30px; letter-spacing: .05em; color: var(--gold); text-shadow: 2px 2px 0 #7a1c12; margin: 14px 0 8px; }
.welcome p { color: var(--text-2); margin: 0 0 18px; }
.no-hits { color: var(--text-3); text-align: center; padding: 30px 12px; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--border); }
.foot-note { font-size: 12px; color: var(--text-3); }

/* ===== Editoren ===== */
.md-editor { display: flex; flex-direction: column; gap: 6px; }
.md-preview { min-height: 60px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--well); }
.md { line-height: 1.55; word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h3, .md h4, .md h5 { margin: 12px 0 6px; font-size: 15px; }
.md p { margin: 0 0 8px; color: var(--text); }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md li.md-task { list-style: none; margin-left: -20px; }
.md input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.md code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font: 12.5px ui-monospace, Consolas, monospace; }
.md pre { background: var(--well-2); padding: 10px; border-radius: var(--radius-sm); overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 8px; padding: 4px 12px; border-left: 3px solid var(--border-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--border-2); margin: 12px 0; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icon-opt { display: grid; place-items: center; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--well); cursor: pointer; }
.icon-opt:hover { border-color: var(--border-2); background: var(--surface-2); }
.icon-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface-2); }
.icon-pick { display: flex; flex-direction: column; gap: 10px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 28px; height: 28px; border-radius: 7px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.swatch.auto { display: grid; place-items: center; background: var(--well); color: var(--text-2); font-size: 12px; font-weight: 700; box-shadow: inset 0 0 0 1px var(--border-2); }
.accent-opt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--well); cursor: pointer; color: var(--text); }
.accent-opt span.sw { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .3); }
.accent-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.form-head { display: flex; align-items: flex-end; gap: 14px; }
.form-head .field { flex: 1; }
.title-input { font-weight: 600; font-size: 15px; }
.warn-note { font-size: 12px; color: #ffbf55; display: flex; align-items: flex-start; gap: 6px; margin: 0; }
.warn-note .ui-icon { margin-top: 1px; }
.detail-head { display: flex; gap: 14px; align-items: flex-start; }
.detail-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.detail-info a { overflow-wrap: anywhere; }
.detail-info .desc { color: var(--text-2); margin: 4px 0 0; }
.detail-status { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--well); border: 1px solid var(--border); }
.detail-status .status-detail { flex: 1; min-width: 180px; font-size: 12px; color: var(--text-3); }

/* ===== Daten übertragen ===== */
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.transfer-panel { display: flex; flex-direction: column; gap: 10px; }
.transfer-panel h2.section { margin-bottom: 2px; }
.transfer-panel p { margin: 0; }
textarea.code-box { font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; min-height: 112px; resize: vertical; }
.transfer-panel.drop-active { outline: 2px dashed var(--accent); outline-offset: -6px; background: var(--accent-soft); }
.drop-hint { margin: 0; }
.steps { margin: 0; padding-left: 22px; color: var(--text-2); }
.steps li { margin: 6px 0; }

/* ===== Dialoge ===== */
dialog { border: 1px solid var(--border-2); border-radius: 14px; background: var(--surface); color: var(--text); padding: 0; box-shadow: var(--shadow); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(3, 10, 20, .7); backdrop-filter: blur(2px); }
dialog.narrow { width: min(460px, calc(100vw - 32px)); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
.dlg-head h2 { margin: 0; font-family: var(--font-head); font-weight: 400; font-size: 25px; letter-spacing: .05em; flex: 1; overflow-wrap: anywhere; }
.dlg-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--border); }
.dlg-body h3 { margin: 6px 0 0; font-size: 14px; }
.dlg-body p { margin: 0; color: var(--text-2); }
.help h3 { font-family: var(--font-head); font-weight: 400; font-size: 19px; letter-spacing: .05em; color: var(--accent); margin-top: 10px; }
.help ul { margin: 4px 0 0; padding-left: 20px; color: var(--text-2); }
.help li { margin: 3px 0; }
.settings-group { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.settings-group:last-child { border-bottom: 0; padding-bottom: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: #ff7b78; font-size: 13px; }

/* ===== Kompakt-Ansicht ===== */
.compact .cat { flex-basis: calc(var(--span) * 178px + 30px); min-width: min(100%, 220px); }
.compact .cat-head { margin-bottom: 8px; min-height: 40px; padding-top: 4px; padding-bottom: 4px; }
.compact .cat-toggle { font-size: 18px; }
.compact .tiles { grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 6px; }
.compact .tile { flex-direction: row; align-items: center; border-radius: 7px; box-shadow: 0 2px 0 rgba(0, 0, 0, .35), inset 0 0 0 2px rgba(255, 248, 225, .45); }
.compact .tile::before { left: -2px; right: auto; top: -2px; bottom: -2px; width: 6px; height: auto; border-radius: 6px 0 0 6px; box-shadow: inset -2px 0 0 rgba(0, 0, 0, .2); }
.compact .tile:hover { transform: translateY(-2px); box-shadow: 0 4px 0 rgba(0, 0, 0, .3), 0 8px 16px rgba(0, 0, 0, .25), inset 0 0 0 2px rgba(255, 248, 225, .45); }
.compact .tile-main { padding: 5px 2px 5px 12px; gap: 0 8px; border-radius: 7px 0 0 7px; min-width: 0; align-self: stretch; align-content: center; }
.compact .tile-desc { display: none; }
.compact .tile-name { font-size: 15px; }
.compact .tile-name .ui-icon { display: none; }
.compact .tile-host { font-size: 10.5px; margin-top: 0; }
.compact .app-badge { width: 28px; height: 28px; }
.compact .app-badge img, .compact .app-badge .px-icon svg { width: 18px; height: 18px; }
.compact .app-badge .letter { font-size: 15px; }
.compact .tile-foot { padding: 0 4px 0 0; min-height: 0; gap: 0; flex: none; }
.compact .tile-foot .status { order: -1; margin-right: 4px; }
.compact .tile-foot .status .txt { display: none; }
.compact .tile-foot .spacer { display: none; }
.compact .tile-foot .icon-btn { width: 24px; height: 24px; }
.compact .tile-foot [data-fkey^="tile-edit-"] { display: none; }
.compact .tile:hover [data-fkey^="tile-edit-"], .compact .tile:focus-within [data-fkey^="tile-edit-"], .compact.arranging [data-fkey^="tile-edit-"] { display: inline-grid; }
@media (hover: none) { .compact .tile-foot [data-fkey^="tile-edit-"] { display: inline-grid; } }

/* ===== Schmale Fenster ===== */
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 16px 16px 32px; }
  .top { gap: 12px 6px; }
  .brand { flex: 1 1 100%; }
  .search { flex: 1 1 0; min-width: 0; }
  .top-actions .lbl { display: none; }
  .grid2 { grid-template-columns: 1fr; }
  .view-head h1 { font-size: 22px; }
  .head-text { flex-basis: 100%; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .compact .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .compact .tile-host { display: none; }
  .compact .tile-main { padding: 7px 2px 7px 10px; }
  .compact .tile-foot [data-fkey^="tile-edit-"] { display: none !important; }
  .cat-nav { margin: 0 -16px 14px; padding: 8px 16px; }
  .cat-nav .btn .lbl { display: none; }
  .cats { gap: 14px; }
  .cat { padding: 0 10px 10px; }
  .cat-head { margin: 0 -10px 12px; }
  .cat-peek { display: none; }
  .brand-name { font-size: 25px; }
  .dlg-foot { padding: 12px 14px 14px; gap: 6px; }
  .dlg-foot .btn { padding: 7px 10px; }
}
</style>

/* ===== DOM-Helfer ===== */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  const late = {};
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') { for (const [sk, sv] of Object.entries(v)) el.style.setProperty(sk, sv); }
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'value' || k === 'checked') late[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  for (const [k, v] of Object.entries(late)) el[k] = v;
  return el;
}
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function uid() {

}

}

}

/* ===== Adressen (nur http/https, nie javascript: o. Ä.) ===== */
function safeUrl(u) {
  try {
    const x = new URL(u);
    return (x.protocol === 'https:' || x.protocol === 'http:') && x.hostname ? x.href : '';
  } catch (_) { return ''; }
}
function normalizeUrl(input) {
  let t = String(input || '').trim();
  if (!t) return { error: 'Bitte eine Adresse eintragen.' };
  // „beispiel.de“ oder „localhost:8080“ bekommen https://, „javascript:…“ & Co. bleiben und werden abgelehnt
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(t) && !/^[a-z][a-z0-9+.-]*:(?!\d)/i.test(t)) t = 'https://' + t;
  let x;
  try { x = new URL(t); } catch (_) { return { error: 'Das ist keine gültige Adresse.' }; }
  if (x.protocol !== 'https:' && x.protocol !== 'http:') return { error: 'Nur Web-Adressen mit https:// oder http:// sind erlaubt.' };
  if (!x.hostname) return { error: 'Das ist keine gültige Adresse.' };
  return { url: x.href };
}
function hostLabel(url) {
  try {
    const x = new URL(url);
    const path = x.pathname === '/' ? '' : x.pathname.replace(/\/$/, '');
    let s = x.host.replace(/^www\./, '') + path;
    try { s = decodeURI(s); } catch (_) { /* bleibt kodiert */ }
    return s;
  } catch (_) { return url; }
}

const arr = v => Array.isArray(v) ? v : [];
const str = v => typeof v === 'string' ? v : '';

const hexOrEmpty = v => /^#[0-9a-f]{6}$/i.test(str(v)) ? v : '';
const isoOrNull = v => typeof v === 'string' && !Number.isNaN(Date.parse(v)) ? v : null;

  const o = ic && typeof ic === 'object' ? ic : {};
  return {
    type: ICON_TYPES.some(t => t.v === o.type) ? o.type : 'letter',
    name: iconName(str(o.name)),
    src: safeUrl(str(o.src)),

function normalize(raw) {
  const s = emptyState();
  if (!raw || typeof raw !== 'object') return s;
  const st = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
  const accent = ACCENT_ALIAS[st.accent] || st.accent;
  if (ACCENTS.some(a => a.v === accent)) s.settings.accent = accent;
  if (OPEN_MODES.some(o => o.v === st.openIn)) s.settings.openIn = st.openIn;
  const catIds = new Set(), appIds = new Set();
  for (const c of arr(raw.categories)) {
    if (!c || typeof c !== 'object') continue;
    const id = str(c.id) || uid();
    if (catIds.has(id)) continue;
    catIds.add(id);
    s.categories.push({ id, name: str(c.name).trim().slice(0, 60) || 'Kategorie', color: hexOrEmpty(c.color), order: num(c.order), ...stamps(c) });
  }
  for (const a of arr(raw.apps)) {
    if (!a || typeof a !== 'object') continue;
    const id = str(a.id) || uid();
    if (appIds.has(id)) continue;
    appIds.add(id);
    s.apps.push({
      id, name: str(a.name).trim().slice(0, 80), url: safeUrl(str(a.url)), categoryId: str(a.categoryId) || null,
      icon: normIcon(a.icon), color: /^#[0-9a-f]{6}$/i.test(str(a.color)) ? a.color : COLORS[0],
      description: str(a.description).slice(0, 300), notes: str(a.notes), order: num(a.order), ...stamps(a)
    });

}

    try {
      this.state = normalize(JSON.parse(raw));
    } catch (e) {

/* ===== Markdown (HTML wird zuerst escaped) ===== */
function mdInline(s) {
  const keep = [];
  const stash = html => { keep.push(html); return `\u0000${keep.length - 1}\u0000`; };
  s = s.replace(/`([^`]+)`/g, (_, c) => stash(`<code>${c}</code>`));
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => stash(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (_, pre, u) => pre + stash(`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`));
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[Number(i)]);
}
function mdToHtml(src) {
  const lines = escHtml(src || '').split(/\r?\n/);
  const out = [];
  let list = null, para = [], quote = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(mdInline).join('<br>') + '</p>'); para = []; } };
  const flushQuote = () => { if (quote.length) { out.push('<blockquote>' + quote.map(mdInline).join('<br>') + '</blockquote>'); quote = []; } };
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const openList = tag => { if (list !== tag) { closeList(); out.push(`<${tag}>`); list = tag; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (/^\s*```/.test(line)) {
      flushPara(); flushQuote(); closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }
    if (!line.trim()) { flushPara(); flushQuote(); closeList(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushPara(); flushQuote(); closeList();
      const lvl = m[1].length + 2;
      out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushQuote(); closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); closeList(); quote.push(m[1]); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      flushPara(); flushQuote(); openList('ul');
      const tm = m[1].match(/^\[( |x|X)\]\s+(.*)$/);
      out.push(tm ? `<li class="md-task"><input type="checkbox" disabled${tm[1] === ' ' ? '' : ' checked'}> ${mdInline(tm[2])}</li>` : `<li>${mdInline(m[1])}</li>`);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); flushQuote(); openList('ol'); out.push(`<li>${mdInline(m[1])}</li>`); continue; }
    flushQuote(); closeList();
    para.push(line);
  }
  flushPara(); flushQuote(); closeList();
  return out.join('');
}

function exportData() {

}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `apphub-backup-${todayStr()}.json` });
  document.body.append(a);

}
const WRONG_APP = 'Das sind Blueprint-Daten. Lade sie in Blueprint unter „Daten übertragen“, hier gehören App-Hub-Daten hin.';
async function importFromFile(file) {
  if (!file) return false;
  let text;
  try { text = await file.text(); } catch (_) { toast('Die Datei konnte nicht gelesen werden.', { error: true }); return false; }
  const t = text.replace(/^﻿/, '').trim();
  let obj;
  if (t.startsWith('{')) {
    try { obj = JSON.parse(t); } catch (_) { toast('Die Datei ist kein gültiges Backup (kein JSON).', { error: true }); return false; }
  } else if (/^(APPHUB1|BLUEPRINT1):/.test(t.replace(/\s+/g, ''))) {
    try { obj = await decodeTransfer(t); } catch (e) { toast(e instanceof SyntaxError ? 'Der Code in der Datei ist beschädigt.' : e.message, { error: true }); return false; }
  } else {
    toast('Die Datei ist kein App-Hub-Backup.', { error: true });
    return false;
  }
  const data = unwrapPayload(obj);
  if (!data) { toast(obj && obj.app === 'blueprint' ? WRONG_APP : 'Die Datei ist kein App-Hub-Backup.', { error: true, timeout: 7000 }); return false; }
  return importPayload(data, { kind: 'Backup', exportedAt: obj.exportedAt });
}
function pickImportFile() {
  const inp = h('input', { type: 'file', accept: '.json,.txt,application/json,text/plain', style: { display: 'none' } });
  inp.addEventListener('change', () => { const file = inp.files[0]; inp.remove(); importFromFile(file); });
  inp.addEventListener('cancel', () => inp.remove());
  document.body.append(inp);
  inp.click();
}
const hasFiles = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
function wireFileDrop(el) {
  el.addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    el.classList.add('drop-active');
  });
  el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('drop-active'); });
  el.addEventListener('drop', e => {
    el.classList.remove('drop-active');
    const file = e.dataTransfer && e.dataTransfer.files[0];
    if (file) { e.preventDefault(); importFromFile(file); return; }
    const text = e.dataTransfer && e.dataTransfer.getData('text/plain');
    if (text && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); ui.importText = text; ui.importError = ''; render(); }
  });
}

/* ===== Daten übertragen (Code zum Kopieren & Einfügen) ===== */
const canCompress = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
function bytesToB64url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodeTransfer() {
  const json = JSON.stringify(exportData());
  if (!canCompress()) return json;
  const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
  return CODE_PREFIX + bytesToB64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function decodeTransfer(text) {
  const t = text.trim();
  if (t.startsWith('{')) return JSON.parse(t);
  const compact = t.replace(/\s+/g, '');
  if (compact.startsWith('BLUEPRINT1:')) throw new Error('Das ist ein Blueprint-Code. Füge ihn in Blueprint unter „Daten übertragen“ ein, hier gehören Codes mit „APPHUB1:“ hin.');
  if (!compact.startsWith(CODE_PREFIX)) throw new Error('Das ist kein App-Hub-Code. Er beginnt immer mit „APPHUB1:“.');
  if (!canCompress()) throw new Error('Dieser Browser kann den Code nicht entpacken. Bitte Browser aktualisieren oder eine Backup-Datei nutzen.');
  let json;
  try {
    const stream = new Blob([b64urlToBytes(compact.slice(CODE_PREFIX.length))]).stream().pipeThrough(new DecompressionStream('gzip'));
    json = await new Response(stream).text();
  } catch (_) {
    throw new Error('Der Code ist unvollständig oder beschädigt. Bitte den kompletten Code kopieren und erneut einfügen.');
  }
  return JSON.parse(json);
}
function unwrapPayload(obj) {
  const data = obj && obj.app === 'apphub' && obj.data ? obj.data : obj;
  return data && Array.isArray(data.apps) && Array.isArray(data.categories) ? data : null;
}
// Gleiche ID: die zuletzt geänderte Version gewinnt. Gleichnamige Kategorien und gleiche Adressen
// von einem anderen Gerät werden zusammengelegt statt doppelt angelegt.
function mergeState(local, incoming) {
  const count = { added: 0, updated: 0, same: 0 };
  const time = x => Date.parse(x.updatedAt) || 0;
  const put = (list, item) => {
    const i = list.findIndex(x => x.id === item.id);
    if (i < 0) { list.push(item); count.added++; }
    else if (time(item) > time(list[i])) { list[i] = item; count.updated++; }
    else count.same++;
  };
  const remap = new Map();
  const catByName = new Map(local.categories.filter(c => !c.deletedAt).map(c => [nameKey(c.name), c]));
  for (const c of incoming.categories) {
    const twin = !c.deletedAt && catByName.get(nameKey(c.name));
    if (twin && twin.id !== c.id && !local.categories.some(x => x.id === c.id)) { remap.set(c.id, twin.id); count.same++; continue; }
    put(local.categories, c);
  }
  const appByUrl = new Map(local.apps.filter(a => !a.deletedAt && a.url).map(a => [a.url, a]));
  for (const a of incoming.apps) {
    if (remap.has(a.categoryId)) a.categoryId = remap.get(a.categoryId);
    const twin = !a.deletedAt && a.url && appByUrl.get(a.url);
    if (twin && twin.id !== a.id && !local.apps.some(x => x.id === a.id)) { count.same++; continue; }
    put(local.apps, a);
  }
  return count;
}
function contentText(st) {
  const apps = st.apps.filter(a => !a.deletedAt).length;
  const cats = st.categories.filter(c => !c.deletedAt).length;
  return `${plural(apps, 'App', 'Apps')} in ${plural(cats, 'Kategorie', 'Kategorien')}`;
}
async function importPayload(data, { kind, exportedAt }) {
  const incoming = normalize(data);
  const when = exportedAt ? ` vom ${new Date(exportedAt).toLocaleString('de-DE')}` : '';
  const what = `${kind}${when} mit ${contentText(incoming)}`;
  let mode;
  if (!hasData()) {
    mode = (await confirmDialog(`${what} übernehmen?`, { title: `${kind} laden`, ok: 'Übernehmen' })) ? 'replace' : null;
  } else {
    mode = await choiceDialog([
      `${what} laden. Auf diesem Gerät sind schon ${contentText(S())}.`,
      '„Zusammenführen“ ergänzt Neues und übernimmt bei gleichen Einträgen die zuletzt geänderte Version. „Alles ersetzen“ überschreibt den Stand auf diesem Gerät.'
    ], { title: `${kind} laden`, choices: [{ v: 'replace', label: 'Alles ersetzen', cls: 'danger-solid' }, { v: 'merge', label: 'Zusammenführen', cls: 'primary', autofocus: true }] });
  }
  if (!mode) return false;
  try { localStorage.setItem(`${STORAGE_KEY}:vor-import`, JSON.stringify(S())); } catch (_) { /* voll */ }
  let msg;
  if (mode === 'merge') {
    const c = mergeState(S(), incoming);
    store.save();
    msg = `Zusammengeführt: ${c.added} neu, ${c.updated} aktualisiert, ${c.same} unverändert.`;
  } else {
    store.replace(incoming);
    msg = `${kind} geladen.`;
  }
  ui.importText = '';
  ui.importError = '';
  ui.exportCode = null;
  ui.status = {};
  modal.close();
  applyAccent();
  go('#/');
  render();
  toast(msg);
  checkAll();
  return true;
}
async function importFromText() {
  const text = ui.importText.trim();
  const fail = m => { ui.importError = m; ui.pendingFocus = 'transfer-import'; render(); };
  if (!text) return fail('Bitte zuerst einen Code einfügen.');
  let obj;
  try { obj = await decodeTransfer(text); } catch (e) {
    return fail(e instanceof SyntaxError ? 'Der Text ist kein gültiger App-Hub-Code. Bitte den kompletten Code kopieren und erneut einfügen.' : e.message);
  }
  const data = unwrapPayload(obj);
  if (!data) return fail(obj && obj.app === 'blueprint' ? WRONG_APP : 'Der Code enthält keine App-Hub-Daten.');
  ui.importError = '';
  await importPayload(data, { kind: 'Übertragungs-Code', exportedAt: obj.exportedAt });
}

function init() {

  applyAccent();
  setIcons();
  ui.route = parseRoute();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) { /* egal */ }

  window.addEventListener('hashchange', () => {
    ui.route = parseRoute();
    if (ui.route.view !== 'transfer') { ui.exportCode = null; ui.importText = ''; ui.importError = ''; }
    window.scrollTo(0, 0);
    render();
  });
  document.addEventListener('keydown', e => {
    if ($('#modal').open || $('#confirm').open) return;
    const typing = e.target.closest && e.target.closest('input, textarea, select');
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && ui.route.view === 'home') { e.preventDefault(); $('[data-fkey="search"]')?.focus(); }
    else if (e.key === 'Escape' && ui.arrange && !typing) toggleArrange();

  // Änderungen aus einem anderen Tab übernehmen
  window.addEventListener('storage', e => {
    if (e.key !== STORAGE_KEY) return;
    store.load();
    applyAccent();
    render();
  });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - ui.lastCheckAll > RECHECK_MS) checkAll();
  });
  window.addEventListener('online', checkAll);
