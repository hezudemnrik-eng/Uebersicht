<style>
/* ===== Design-Tokens ===== */
:root {
  color-scheme: dark;
  --bg: #121418;
  --surface: #1a1d23;
  --surface-2: #21252d;
  --surface-3: #2a2f39;
  --border: #2e333e;
  --border-2: #3b4150;
  --text: #e8eaef;
  --text-2: #b3b9c5;
  --text-3: #7b8292;
  --accent: #6cc04a;
  --accent-strong: #86d665;
  --accent-ink: #0d1909;
  --accent-soft: rgba(108, 192, 74, .14);
  --danger: #ef5350;
  --danger-soft: rgba(239, 83, 80, .14);
  --ok: #5cc85c;
  --bad: #ef5350;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-px: "Silkscreen", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
:root[data-accent="diamond"] { --accent: #3ad6cf; --accent-strong: #66e8e2; --accent-ink: #032220; --accent-soft: rgba(58, 214, 207, .14); }
:root[data-accent="redstone"] { --accent: #f0483e; --accent-strong: #ff6d64; --accent-ink: #ffffff; --accent-soft: rgba(240, 72, 62, .15); }
:root[data-accent="gold"] { --accent: #f2c230; --accent-strong: #ffd75e; --accent-ink: #241a00; --accent-soft: rgba(242, 194, 48, .14); }

/* ===== Grundlagen ===== */
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-strong); }
[hidden] { display: none !important; }
.muted { color: var(--text-3); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.px-icon { display: inline-flex; flex: none; }
.px-icon svg { display: block; }
.ui-icon { display: inline-flex; flex: none; }
.ui-icon svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== Buttons & Eingaben ===== */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); cursor: pointer; white-space: nowrap; line-height: 1.2; text-decoration: none; }
.btn:hover { background: var(--surface-3); }
.btn:focus-visible, .icon-btn:focus-visible, .seg button:focus-visible, .cat-toggle:focus-visible, .icon-opt:focus-visible, .swatch:focus-visible, .accent-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 600; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22), inset 0 2px 0 rgba(255, 255, 255, .22); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; font-weight: 600; }
.btn.small { padding: 5px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-sm); border: 0; background: transparent; color: var(--text-3); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; color: var(--text-3); }
.icon-btn.danger-hover:hover { color: var(--danger); background: var(--danger-soft); }
.input, select.input, textarea.input { width: 100%; padding: 7px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: #15181d; color: var(--text); outline: none; min-width: 0; }
.input:focus, textarea.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.5; }
.input::placeholder, textarea::placeholder { color: var(--text-3); }
select.input { padding-right: 28px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.field-hint { font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
.field-hint.bad { color: #ff7b78; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; background: #15181d; border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 2px; gap: 2px; align-self: flex-start; }
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }

/* ===== Kopfbereich ===== */
.wrap { max-width: 1480px; margin: 0 auto; padding: 24px 28px 40px; }
.top { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; margin-bottom: 22px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand-name { font-family: var(--font-px); font-size: 24px; line-height: 1; letter-spacing: .04em; }
.summary { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.summary .sum { display: inline-flex; align-items: center; gap: 5px; }
.summary .dot { width: 7px; height: 7px; border-radius: 2px; }
.summary .on .dot { background: var(--ok); }
.summary .off { color: #ff8a87; }
.summary .off .dot { background: var(--bad); }
.search { position: relative; flex: 0 1 380px; min-width: 220px; }
.search .ui-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .input { padding-left: 34px; height: 36px; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.top-actions .btn { height: 36px; }
.view-head { display: flex; align-items: center; gap: 12px 16px; margin-bottom: 18px; flex-wrap: wrap; }
.view-head h1 { font-family: var(--font-px); font-weight: 400; font-size: 26px; line-height: 1.1; margin: 0; letter-spacing: .02em; }
.head-text { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
h2.section { font-family: var(--font-px); font-weight: 400; font-size: 16px; margin: 0 0 12px; letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }

/* ===== Hinweise & Toasts ===== */
.banner { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: var(--radius); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); flex-wrap: wrap; margin-bottom: 18px; }
.banner .text { flex: 1; min-width: 200px; }
#toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 100; max-width: min(420px, calc(100vw - 36px)); }
.toast { display: flex; align-items: center; gap: 12px; background: var(--surface-3); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 10px 12px 10px 14px; box-shadow: var(--shadow); animation: toast-in .18s ease-out; }
.toast.error { border-color: var(--danger); }
.toast .text { flex: 1; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }

/* ===== Kategorien ===== */
.cat { margin-bottom: 26px; }
.cat-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; min-height: 30px; border-radius: var(--radius-sm); }
.cat-head.drag-over { background: var(--accent-soft); }
.cat-toggle { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--text); cursor: pointer; padding: 2px 4px 2px 0; font-family: var(--font-px); font-size: 16px; letter-spacing: .03em; text-align: left; min-width: 0; border-radius: 4px; }
.cat-toggle:disabled { cursor: default; color: var(--text); }
.cat-toggle .ui-icon { color: var(--text-3); transition: transform .15s; transform: rotate(90deg); }
.cat.collapsed .cat-toggle .ui-icon { transform: none; }
.cat-name { overflow-wrap: anywhere; }
.cat.none .cat-name { color: var(--text-2); }
.cat-count { font-size: 12px; color: var(--text-3); background: var(--surface-3); padding: 1px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.cat-line { flex: 1; height: 1px; background: var(--border); min-width: 12px; }
.cat-tools { display: none; gap: 2px; }
.cat-head:hover .cat-tools, .cat-head:focus-within .cat-tools, .arranging .cat-tools { display: flex; }

/* ===== Kacheln ===== */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; border-radius: var(--radius); transition: background .15s; }
.tiles.drag-over { background: var(--accent-soft); box-shadow: 0 0 0 6px var(--accent-soft); }
.tiles-empty { grid-column: 1 / -1; color: var(--text-3); font-size: 13px; padding: 16px; border: 1px dashed var(--border-2); border-radius: var(--radius-sm); text-align: center; }
.tile { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .12s, background .12s; }
.tile::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--pc); opacity: .9; }
.tile:hover { border-color: var(--border-2); background: var(--surface-2); }
.tile.dragging { opacity: .4; }
.tile.drop-before::after, .tile.drop-after::after { content: ""; position: absolute; top: 6px; bottom: 6px; width: 4px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tile.drop-before::after { left: -8px; }
.tile.drop-after::after { right: -8px; }
.tile-main { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; align-content: start; gap: 0 12px; padding: 16px 14px 8px; color: var(--text); text-decoration: none; flex: 1; border-radius: var(--radius) var(--radius) 0 0; }
.tile-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tile-main.disabled { cursor: default; }
.tile-text { min-width: 0; }
.tile-name { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 15px; line-height: 1.3; }
.tile-name span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-name .ui-icon { color: var(--text-3); }
.tile-host { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.tile-main.disabled .tile-host { color: #ff8a87; }
.tile-desc { grid-column: 1 / -1; color: var(--text-2); font-size: 13px; line-height: 1.4; margin-top: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.tile-foot { display: flex; align-items: center; gap: 2px; padding: 2px 8px 8px 14px; min-height: 38px; }
.tile-foot .icon-btn.has-notes { color: var(--accent); }
.app-badge { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; flex: none; overflow: hidden; background: color-mix(in srgb, var(--pc) 22%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 45%, transparent); }
.app-badge img { width: 28px; height: 28px; object-fit: contain; }
.app-badge .letter { font-family: var(--font-px); font-size: 19px; line-height: 1; color: color-mix(in srgb, var(--pc) 55%, #fff); white-space: nowrap; }
.app-badge.big { width: 64px; height: 64px; border-radius: 14px; }
.app-badge.big img { width: 40px; height: 40px; }
.app-badge.big .letter { font-size: 26px; }

/* ===== Online-Status ===== */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--text-3); flex: none; }
.status.online { color: var(--text-2); }
.status.online .dot { background: var(--ok); box-shadow: 0 0 0 3px rgba(92, 200, 92, .16); }
.status.offline { color: #ff8a87; }
.status.offline .dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(239, 83, 80, .16); }
.status.checking .dot { animation: pulse .9s ease-in-out infinite alternate; }
.status.unknown .dot, .status.none .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); }
@keyframes pulse { from { opacity: .25; } to { opacity: 1; } }

/* ===== Leerer Zustand, Fuß ===== */
.welcome { max-width: 620px; margin: 30px auto; text-align: center; padding: 30px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.welcome h2 { font-family: var(--font-px); font-weight: 400; font-size: 22px; margin: 14px 0 8px; }
.welcome p { color: var(--text-2); margin: 0 0 18px; }
.no-hits { color: var(--text-3); text-align: center; padding: 30px 12px; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; margin-top: 34px; padding-top: 14px; border-top: 1px solid var(--border); }
.foot-note { font-size: 12px; color: var(--text-3); }

/* ===== Editoren ===== */
.md-editor { display: flex; flex-direction: column; gap: 6px; }
.md-preview { min-height: 60px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #15181d; }
.md { line-height: 1.55; word-break: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h3, .md h4, .md h5 { margin: 12px 0 6px; font-size: 15px; }
.md p { margin: 0 0 8px; color: var(--text); }
.md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
.md li.md-task { list-style: none; margin-left: -20px; }
.md input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
.md code { background: var(--surface-3); padding: 1px 5px; border-radius: 4px; font: 12.5px ui-monospace, Consolas, monospace; }
.md pre { background: #0f1115; padding: 10px; border-radius: var(--radius-sm); overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 0 0 8px; padding: 4px 12px; border-left: 3px solid var(--border-2); color: var(--text-2); }
.md hr { border: 0; border-top: 1px solid var(--border-2); margin: 12px 0; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
.icon-opt { display: grid; place-items: center; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: #15181d; cursor: pointer; }
.icon-opt:hover { border-color: var(--border-2); background: var(--surface-2); }
.icon-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--surface-2); }
.icon-pick { display: flex; flex-direction: column; gap: 10px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 28px; height: 28px; border-radius: 7px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .3); }
.swatch[aria-pressed="true"] { border-color: var(--text); }
.accent-opt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); background: #15181d; cursor: pointer; color: var(--text); }
.accent-opt span.sw { width: 18px; height: 18px; border-radius: 4px; }
.accent-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.form-head { display: flex; align-items: flex-end; gap: 14px; }
.form-head .field { flex: 1; }
.title-input { font-weight: 600; font-size: 15px; }
.warn-note { font-size: 12px; color: #ffbf55; display: flex; align-items: flex-start; gap: 6px; margin: 0; }
.warn-note .ui-icon { margin-top: 1px; }
.detail-head { display: flex; gap: 14px; align-items: flex-start; }
.detail-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.detail-info a { overflow-wrap: anywhere; }
.detail-info .desc { color: var(--text-2); margin: 4px 0 0; }
.detail-status { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--radius-sm); background: #15181d; border: 1px solid var(--border); }
.detail-status .status-detail { flex: 1; min-width: 180px; font-size: 12px; color: var(--text-3); }

/* ===== Daten übertragen ===== */
.dash-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.transfer-panel { display: flex; flex-direction: column; gap: 10px; }
.transfer-panel h2.section { margin-bottom: 2px; }
.transfer-panel p { margin: 0; }
textarea.code-box { font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; word-break: break-all; min-height: 112px; resize: vertical; }
.transfer-panel.drop-active { outline: 2px dashed var(--accent); outline-offset: -6px; background: var(--accent-soft); }
.drop-hint { margin: 0; }
.steps { margin: 0; padding-left: 22px; color: var(--text-2); }
.steps li { margin: 6px 0; }

/* ===== Dialoge ===== */
dialog { border: 1px solid var(--border-2); border-radius: 14px; background: var(--surface); color: var(--text); padding: 0; box-shadow: var(--shadow); width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(5, 6, 8, .65); backdrop-filter: blur(2px); }
dialog.narrow { width: min(460px, calc(100vw - 32px)); }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
.dlg-head h2 { margin: 0; font-family: var(--font-px); font-weight: 400; font-size: 18px; flex: 1; overflow-wrap: anywhere; }
.dlg-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlg-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--border); }
.dlg-body h3 { margin: 6px 0 0; font-size: 14px; }
.dlg-body p { margin: 0; color: var(--text-2); }
.help h3 { font-family: var(--font-px); font-weight: 400; font-size: 14px; color: var(--accent); margin-top: 10px; }
.help ul { margin: 4px 0 0; padding-left: 20px; color: var(--text-2); }
.help li { margin: 3px 0; }
.settings-group { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.settings-group:last-child { border-bottom: 0; padding-bottom: 0; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: #ff7b78; font-size: 13px; }

/* ===== Schmale Fenster ===== */
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .wrap { padding: 16px 16px 32px; }
  .top { gap: 12px 6px; }
  .brand { flex: 1 1 100%; }
  .search { flex: 1 1 0; min-width: 0; }
  .top-actions .lbl { display: none; }
  .brand-name { font-size: 21px; }
  .grid2 { grid-template-columns: 1fr; }
  .view-head h1 { font-size: 22px; }
  .head-text { flex-basis: 100%; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .dlg-foot { padding: 12px 14px 14px; gap: 6px; }
  .dlg-foot .btn { padding: 7px 10px; }
}

/* ===== Markdown (HTML wird zuerst escaped) ===== */
function mdInline(s) {
  const keep = [];
  const stash = html => { keep.push(html); return `\u0000${keep.length - 1}\u0000`; };
  s = s.replace(/`([^`]+)`/g, (_, c) => stash(`<code>${c}</code>`));
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, t, u) => stash(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`));

  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^\w])_([^_\s][^_]*?)_(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[Number(i)]);
}

  const lines = escHtml(src || '').split(/\r?\n/);
  const out = [];
  let list = null, para = [], quote = [];
  const flushPara = () => { if (para.length) { out.push('<p>' + para.map(mdInline).join('<br>') + '</p>'); para = []; } };
  const flushQuote = () => { if (quote.length) { out.push('<blockquote>' + quote.map(mdInline).join('<br>') + '</blockquote>'); quote = []; } };
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const openList = tag => { if (list !== tag) { closeList(); out.push(`<${tag}>`); list = tag; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if (/^\s*```/.test(line)) {
      flushPara(); flushQuote(); closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }
    if (!line.trim()) { flushPara(); flushQuote(); closeList(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) {
      flushPara(); flushQuote(); closeList();
      const lvl = m[1].length + 2;
      out.push(`<h${lvl}>${mdInline(m[2])}</h${lvl}>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); flushQuote(); closeList(); out.push('<hr>'); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { flushPara(); closeList(); quote.push(m[1]); continue; }

      out.push(tm ? `<li class="md-task"><input type="checkbox" disabled${tm[1] === ' ' ? '' : ' checked'}> ${mdInline(tm[2])}</li>` : `<li>${mdInline(m[1])}</li>`);
      continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); flushQuote(); openList('ol'); out.push(`<li>${mdInline(m[1])}</li>`); continue; }
    flushQuote(); closeList();
    para.push(line);
  }
  flushPara(); flushQuote(); closeList();
  return out.join('');
}

/* ===== Backup-Datei ===== */
function exportData() {
  const { settings, categories, apps } = S();
  return { app: 'apphub', schemaVersion: SCHEMA_VERSION, exportedAt: nowIso(), data: { settings: { ...settings }, categories, apps } };
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(exportData(), null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `apphub-backup-${todayStr()}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Backup-Datei wird heruntergeladen.');
}
const WRONG_APP = 'Das sind Blueprint-Daten. Lade sie in Blueprint unter „Daten übertragen“, hier gehören App-Hub-Daten hin.';
async function importFromFile(file) {
  if (!file) return false;
  let text;
  try { text = await file.text(); } catch (_) { toast('Die Datei konnte nicht gelesen werden.', { error: true }); return false; }
  const t = text.replace(/^﻿/, '').trim();
  let obj;
  if (t.startsWith('{')) {
    try { obj = JSON.parse(t); } catch (_) { toast('Die Datei ist kein gültiges Backup (kein JSON).', { error: true }); return false; }
  } else if (/^(APPHUB1|BLUEPRINT1):/.test(t.replace(/\s+/g, ''))) {
    try { obj = await decodeTransfer(t); } catch (e) { toast(e instanceof SyntaxError ? 'Der Code in der Datei ist beschädigt.' : e.message, { error: true }); return false; }
  } else {
    toast('Die Datei ist kein App-Hub-Backup.', { error: true });
    return false;
  }
  const data = unwrapPayload(obj);
  if (!data) { toast(obj && obj.app === 'blueprint' ? WRONG_APP : 'Die Datei ist kein App-Hub-Backup.', { error: true, timeout: 7000 }); return false; }
  return importPayload(data, { kind: 'Backup', exportedAt: obj.exportedAt });
}
function pickImportFile() {
  const inp = h('input', { type: 'file', accept: '.json,.txt,application/json,text/plain', style: { display: 'none' } });
  inp.addEventListener('change', () => { const file = inp.files[0]; inp.remove(); importFromFile(file); });
  inp.addEventListener('cancel', () => inp.remove());
  document.body.append(inp);
  inp.click();
}
const hasFiles = e => [...((e.dataTransfer && e.dataTransfer.types) || [])].includes('Files');
function wireFileDrop(el) {
  el.addEventListener('dragover', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    el.classList.add('drop-active');
  });
  el.addEventListener('dragleave', e => { if (!el.contains(e.relatedTarget)) el.classList.remove('drop-active'); });
  el.addEventListener('drop', e => {
    el.classList.remove('drop-active');
    const file = e.dataTransfer && e.dataTransfer.files[0];
    if (file) { e.preventDefault(); importFromFile(file); return; }
    const text = e.dataTransfer && e.dataTransfer.getData('text/plain');
    if (text && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); ui.importText = text; ui.importError = ''; render(); }
  });
}

/* ===== Daten übertragen (Code zum Kopieren & Einfügen) ===== */
const canCompress = () => typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
function bytesToB64url(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodeTransfer() {
  const json = JSON.stringify(exportData());
  if (!canCompress()) return json;
  const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
  return CODE_PREFIX + bytesToB64url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function decodeTransfer(text) {
  const t = text.trim();
  if (t.startsWith('{')) return JSON.parse(t);
  const compact = t.replace(/\s+/g, '');
  if (compact.startsWith('BLUEPRINT1:')) throw new Error('Das ist ein Blueprint-Code. Füge ihn in Blueprint unter „Daten übertragen“ ein, hier gehören Codes mit „APPHUB1:“ hin.');
  if (!compact.startsWith(CODE_PREFIX)) throw new Error('Das ist kein App-Hub-Code. Er beginnt immer mit „APPHUB1:“.');
  if (!canCompress()) throw new Error('Dieser Browser kann den Code nicht entpacken. Bitte Browser aktualisieren oder eine Backup-Datei nutzen.');
  let json;
  try {
    const stream = new Blob([b64urlToBytes(compact.slice(CODE_PREFIX.length))]).stream().pipeThrough(new DecompressionStream('gzip'));
    json = await new Response(stream).text();
  } catch (_) {
    throw new Error('Der Code ist unvollständig oder beschädigt. Bitte den kompletten Code kopieren und erneut einfügen.');
  }
  return JSON.parse(json);
}
function unwrapPayload(obj) {
  const data = obj && obj.app === 'apphub' && obj.data ? obj.data : obj;
  return data && Array.isArray(data.apps) && Array.isArray(data.categories) ? data : null;
}
// Gleiche ID: die zuletzt geänderte Version gewinnt. Gleichnamige Kategorien und gleiche Adressen
// von einem anderen Gerät werden zusammengelegt statt doppelt angelegt.
function mergeState(local, incoming) {
  const count = { added: 0, updated: 0, same: 0 };
  const time = x => Date.parse(x.updatedAt) || 0;
  const put = (list, item) => {
    const i = list.findIndex(x => x.id === item.id);
    if (i < 0) { list.push(item); count.added++; }
    else if (time(item) > time(list[i])) { list[i] = item; count.updated++; }
    else count.same++;
  };
  const remap = new Map();
  const catByName = new Map(local.categories.filter(c => !c.deletedAt).map(c => [nameKey(c.name), c]));
  for (const c of incoming.categories) {
    const twin = !c.deletedAt && catByName.get(nameKey(c.name));
    if (twin && twin.id !== c.id && !local.categories.some(x => x.id === c.id)) { remap.set(c.id, twin.id); count.same++; continue; }
    put(local.categories, c);
  }
  const appByUrl = new Map(local.apps.filter(a => !a.deletedAt && a.url).map(a => [a.url, a]));
  for (const a of incoming.apps) {
    if (remap.has(a.categoryId)) a.categoryId = remap.get(a.categoryId);
    const twin = !a.deletedAt && a.url && appByUrl.get(a.url);
    if (twin && twin.id !== a.id && !local.apps.some(x => x.id === a.id)) { count.same++; continue; }
    put(local.apps, a);
  }
  return count;
}
function contentText(st) {
  const apps = st.apps.filter(a => !a.deletedAt).length;
  const cats = st.categories.filter(c => !c.deletedAt).length;
  return `${plural(apps, 'App', 'Apps')} in ${plural(cats, 'Kategorie', 'Kategorien')}`;
}
async function importPayload(data, { kind, exportedAt }) {
  const incoming = normalize(data);
  const when = exportedAt ? ` vom ${new Date(exportedAt).toLocaleString('de-DE')}` : '';
  const what = `${kind}${when} mit ${contentText(incoming)}`;
  let mode;
  if (!hasData()) {
    mode = (await confirmDialog(`${what} übernehmen?`, { title: `${kind} laden`, ok: 'Übernehmen' })) ? 'replace' : null;
  } else {
    mode = await choiceDialog([
      `${what} laden. Auf diesem Gerät sind schon ${contentText(S())}.`,
      '„Zusammenführen“ ergänzt Neues und übernimmt bei gleichen Einträgen die zuletzt geänderte Version. „Alles ersetzen“ überschreibt den Stand auf diesem Gerät.'
    ], { title: `${kind} laden`, choices: [{ v: 'replace', label: 'Alles ersetzen', cls: 'danger-solid' }, { v: 'merge', label: 'Zusammenführen', cls: 'primary', autofocus: true }] });
  }
  if (!mode) return false;
  try { localStorage.setItem(`${STORAGE_KEY}:vor-import`, JSON.stringify(S())); } catch (_) { /* voll */ }
  let msg;
  if (mode === 'merge') {
    const c = mergeState(S(), incoming);
    store.save();
    msg = `Zusammengeführt: ${c.added} neu, ${c.updated} aktualisiert, ${c.same} unverändert.`;
  } else {
    store.replace(incoming);
    msg = `${kind} geladen.`;
  }
  ui.importText = '';
  ui.importError = '';
  ui.exportCode = null;
  ui.status = {};
  modal.close();
  applyAccent();
  go('#/');
  render();
  toast(msg);
  checkAll();
  return true;
}
async function importFromText() {
  const text = ui.importText.trim();
  const fail = m => { ui.importError = m; ui.pendingFocus = 'transfer-import'; render(); };
  if (!text) return fail('Bitte zuerst einen Code einfügen.');
  let obj;
  try { obj = await decodeTransfer(text); } catch (e) {
    return fail(e instanceof SyntaxError ? 'Der Text ist kein gültiger App-Hub-Code. Bitte den kompletten Code kopieren und erneut einfügen.' : e.message);
  }
  const data = unwrapPayload(obj);
  if (!data) return fail(obj && obj.app === 'blueprint' ? WRONG_APP : 'Der Code enthält keine App-Hub-Daten.');
  ui.importError = '';
  await importPayload(data, { kind: 'Übertragungs-Code', exportedAt: obj.exportedAt });
}
async function shareCode(code) {
  try { await navigator.share({ title: 'App-Hub-Daten', text: code }); }
  catch (e) { if (e.name !== 'AbortError') toast('Teilen hat nicht geklappt. Nutze „Kopieren“.', { error: true }); }
}
function renderTransfer() {
  if (ui.exportCode == null && !ui.exportBusy) {
    ui.exportBusy = true;
    encodeTransfer()
      .then(c => { if (ui.route.view === 'transfer') ui.exportCode = c; })
      .catch(e => { console.error(e); toast('Code konnte nicht erstellt werden: ' + e.message, { error: true }); })
      .finally(() => { ui.exportBusy = false; if (ui.route.view === 'transfer') render(); });
  }
  const code = ui.exportCode;
  const head = h('header', { class: 'view-head' },
    h('a', { class: 'btn ghost', href: '#/', 'data-fkey': 'transfer-back' }, sym('back', 15), 'Zurück'),
    h('div', { class: 'head-text' }, h('h1', null, 'Daten übertragen'),
      h('div', { class: 'muted' }, 'Deine Apps per Code oder Datei von einem Gerät aufs andere bringen, z. B. vom Laptop aufs Handy.')));
  const exportPanel = h('section', { class: 'panel transfer-panel' },
    h('h2', { class: 'section' }, sym('upload', 16), '1 · Exportieren'),
    h('p', { class: 'muted' }, 'Auf dem Gerät, auf dem deine Apps eingetragen sind.'),
    h('p', null, `Enthält ${contentText(S())} samt Notizen.`),
    h('textarea', { class: 'input code-box', readonly: true, rows: 5, 'data-fkey': 'transfer-export', value: code || '', placeholder: code == null ? 'Code wird erstellt …' : '',
      onFocus: e => e.target.select() }),
    code ? h('div', { class: 'small muted' }, `${code.length.toLocaleString('de-DE')} Zeichen`) : null,
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn primary', disabled: !code, 'data-fkey': 'transfer-copy', onClick: () => copyText(code, 'Übertragungs-Code') }, sym('copy', 15), 'Kopieren'),
      typeof navigator.share === 'function' ? h('button', { class: 'btn', disabled: !code, 'data-fkey': 'transfer-share', onClick: () => shareCode(code) }, sym('share', 15), 'Teilen …') : null,
      h('button', { class: 'btn ghost', onClick: downloadBackup }, sym('download', 15), 'Als Datei herunterladen')));
  const canDropFiles = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
  const importPanel = h('section', { class: 'panel transfer-panel' },
    h('h2', { class: 'section' }, sym('download', 16), '2 · Importieren'),
    h('p', { class: 'muted' }, 'Auf dem Gerät, das die Apps bekommen soll: Code einfügen oder Backup-Datei laden.'),
    h('textarea', { class: 'input code-box', rows: 5, 'data-fkey': 'transfer-import', placeholder: 'Code hier einfügen (beginnt mit APPHUB1:)', value: ui.importText,
      onInput: e => { ui.importText = e.target.value; if (ui.importError) { ui.importError = ''; $('.transfer-err')?.remove(); } } }),
    ui.importError ? h('div', { class: 'err transfer-err', role: 'alert' }, ui.importError) : null,
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn primary', 'data-fkey': 'transfer-import-btn', onClick: importFromText }, sym('check', 15), 'Importieren'),
      h('button', { class: 'btn', 'data-fkey': 'transfer-file-btn', onClick: pickImportFile }, sym('upload', 15), 'Datei wählen …')),
    canDropFiles ? h('p', { class: 'small muted drop-hint' }, '… oder eine Backup-Datei (.json) einfach hierher ziehen.') : null);
  wireFileDrop(importPanel);
  const how = h('section', { class: 'panel wide' },
    h('h2', { class: 'section' }, sym('help', 16), 'So geht’s'),
    h('ol', { class: 'steps' },
      h('li', null, 'Auf dem einen Gerät: hier „Kopieren“ oder „Teilen …“ und den Code an dich selbst schicken (E-Mail, WhatsApp, AirDrop, Notiz).'),
      h('li', null, 'Auf dem anderen Gerät: App-Hub öffnen → „Daten übertragen“ → den Code ins Feld „Importieren“ einfügen, oder die Backup-Datei mit „Datei wählen …“ laden.'),
      h('li', null, 'Auf „Importieren“ klicken. Sind dort schon eigene Apps, wählst du „Zusammenführen“ oder „Alles ersetzen“.')),
    h('p', { class: 'small muted', style: { margin: '10px 0 0' } }, 'Blueprint hat einen eigenen Code (beginnt mit „BLUEPRINT1:“), den überträgst du in Blueprint selbst.'));
  return h('div', { class: 'wrap' }, head, h('div', { class: 'dash-grid' }, exportPanel, importPanel, how));
}

/* ===== Start ===== */
function init() {
  loadPrefs();
  store.load();
  applyAccent();
  setIcons();
  ui.route = parseRoute();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) { /* egal */ }

  window.addEventListener('hashchange', () => {
    ui.route = parseRoute();
    if (ui.route.view !== 'transfer') { ui.exportCode = null; ui.importText = ''; ui.importError = ''; }
    window.scrollTo(0, 0);
    render();
  });
  document.addEventListener('keydown', e => {
    if ($('#modal').open || $('#confirm').open) return;
    const typing = e.target.closest && e.target.closest('input, textarea, select');
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && ui.route.view === 'home') { e.preventDefault(); $('[data-fkey="search"]')?.focus(); }
    else if (e.key === 'Escape' && ui.arrange && !typing) toggleArrange();
  });
  $('#modal').addEventListener('close', () => { if (!$('#modal').open) modal.build = null; });
  // Änderungen aus einem anderen Tab übernehmen
  window.addEventListener('storage', e => {
    if (e.key !== STORAGE_KEY) return;
    store.load();
    applyAccent();
    render();
  });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - ui.lastCheckAll > RECHECK_MS) checkAll();
  });
  window.addEventListener('online', checkAll);

  render();
  checkAll();
}
init();
</script>
</body>
</html>
